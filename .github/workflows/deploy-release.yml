name: Deploy signed release

run-name: Deploy ${{ inputs.tag }} to EasyPi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed GitHub release tag (for example, v1.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: easypi-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.EASYPI_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.EASYPI_DEPLOY_USER }}
      RELEASE_TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}
      ARCHIVE_NAME: easypi-full-aarch64-trixie.tar.gz
      SIGNATURE_NAME: easypi-full-aarch64-trixie.tar.gz.sig
    steps:
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${DEPLOY_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]

      - name: Connect the runner to the tailnet
        uses: tailscale/github-action@ac425ca19416ebb90dd453776414ffb1cdba8f91 # v4.0.1
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.EASYPI_DEPLOY_HOST }}

      - name: Download and verify release checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/easypi-release"
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --dir "${RUNNER_TEMP}/easypi-release" \
            --pattern "${ARCHIVE_NAME}" \
            --pattern "${SIGNATURE_NAME}" \
            --pattern SHA256SUMS.txt

          cd "${RUNNER_TEMP}/easypi-release"
          archive_sha="$(awk -v name="${ARCHIVE_NAME}" '$2 == name {print $1}' SHA256SUMS.txt)"
          [[ "${archive_sha}" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$(grep -cE "^[a-fA-F0-9]{64}  ${ARCHIVE_NAME}$" SHA256SUMS.txt)" -eq 1 ]]
          printf '%s  %s\n' "${archive_sha,,}" "${ARCHIVE_NAME}" | sha256sum -c -
          [[ -s "${SIGNATURE_NAME}" ]]
          printf '%s\n' "ARCHIVE_SHA256=${archive_sha,,}" >> "${GITHUB_ENV}"

      - name: Configure pinned SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.EASYPI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EASYPI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_KEY}" && -n "${KNOWN_HOSTS}" ]]
          install -d -m 0700 "${RUNNER_TEMP}/ssh"
          printf '%s\n' "${DEPLOY_KEY}" > "${RUNNER_TEMP}/ssh/deploy_key"
          printf '%s\n' "${KNOWN_HOSTS}" > "${RUNNER_TEMP}/ssh/known_hosts"
          chmod 0600 "${RUNNER_TEMP}/ssh/deploy_key" "${RUNNER_TEMP}/ssh/known_hosts"

      - name: Apply signed release with rollback protection
        shell: bash
        run: |
          set -euo pipefail
          archive_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ARCHIVE_NAME}"
          signature_url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${SIGNATURE_NAME}"
          ssh=(
            ssh
            -i "${RUNNER_TEMP}/ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${RUNNER_TEMP}/ssh/known_hosts"
            -o ConnectTimeout=15
            -o ClearAllForwardings=yes
            "${DEPLOY_USER}@${DEPLOY_HOST}"
          )

          "${ssh[@]}" sudo -n /opt/EasyPi/scripts/maintenance/apply_update.sh \
            --mode url \
            --url "${archive_url}" \
            --sig "${signature_url}" \
            --sha256 "${ARCHIVE_SHA256}" \
            --run-install

          expected_version="${RELEASE_TAG#v}"
          installed_version="$("${ssh[@]}" cat /opt/EasyPi/VERSION)"
          [[ "${installed_version}" == "${expected_version}" ]]
          [[ "$("${ssh[@]}" curl --silent --show-error --max-time 10 http://127.0.0.1:8000/health)" == "ok" ]]

