name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./data/ci.db
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ENV: testing
      LOG_TO_FILE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
            backend/requirements-dev.lock

      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock

      - name: Lint all Python code
        run: python -m ruff check backend easypi_netprotection prism_dpi prism_tls_bridge scripts tests

      - name: Validate shell syntax
        run: git ls-files -z '*.sh' | xargs -0 bash -n

      - name: Run backend and security tests
        env:
          PYTHONPATH: backend:.
        run: python -m pytest -q

      - name: Build signed-release bootstrap package
        run: bash scripts/release/prepare_bootstrap_deb.sh --out .build/ci-bootstrap

      - name: Audit backend dependencies
        run: python -m pip_audit --require-hashes --disable-pip -r backend/requirements.lock

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run type-check

      - name: Validate browser acceptance suite
        run: npm run test:e2e -- --list

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

  chameleon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chameleon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache-dependency-path: chameleon/go.sum

      - name: Build Chameleon Linux binaries
        run: bash build.sh

      - name: Run Chameleon security regression gate
        run: go test ./...

      - name: Audit Chameleon dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
