server {
    listen 80;
    listen [::]:80;
    server_name easypi.local _;
    
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name easypi.local _;
    
    # SSL Configuration
    # CA-signed server cert from the per-install EasyPi Root CA (scripts/setup/generate_certs.sh
    # ca-signed). Users import /ca.pem once to trust the panel — no "Proceed unsafe".
    ssl_certificate /opt/EasyPi/certs/cert.pem;
    ssl_certificate_key /opt/EasyPi/certs/key.pem;
    
    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    
    # Frontend static files
    root /opt/EasyPi/frontend/dist;
    index index.html;

    # Fail small by default. Large request bodies are permitted only on the
    # authenticated upload endpoints below, never on public auth/API routes.
    client_max_body_size 1M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;
    
    # PiCloud and File Manager allow 4 GiB files. Nginx keeps one GiB of
    # multipart framing headroom; the backend enforces the per-file limit.
    # Keeping these exact paths separate prevents the
    # same allowance from applying to login/register/refresh.
    location ~ ^/api/v1/(picloud/upload|files/upload)$ {
        auth_request /_easypi_auth;
        client_max_body_size 5G;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Validate the mobile bearer token before accepting a large request body.
    location = /api/v1/mobile/upload {
        auth_request /_easypi_mobile_auth;
        client_max_body_size 5G;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Other bounded uploads have deliberately smaller endpoint-specific caps.
    location = /api/v1/auth/avatar {
        auth_request /_easypi_auth;
        client_max_body_size 6M;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/netprotection/blocklists/custom/upload {
        auth_request /_easypi_auth;
        client_max_body_size 16M;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backup archives may be large, but nginx authenticates the request before
    # it accepts the body and the backend streams it into a bounded private file.
    location = /api/v1/backup/import {
        auth_request /_easypi_admin_auth;
        client_max_body_size 4G;
        client_body_timeout 1800s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # API proxy
    location /api {
        client_body_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API calls can perform long-running installs/updates
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
    
    # WebSocket proxy
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Health check endpoint (direct backend access)
    location /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    location = /_easypi_auth {
        internal;
        # The outer upload location enforces its endpoint-specific limit. This
        # internal subrequest receives no body, but nginx still evaluates the
        # original Content-Length here before auth_request runs.
        client_max_body_size 4G;
        proxy_pass http://127.0.0.1:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_easypi_mobile_auth {
        internal;
        # auth_request inherits Content-Length; the outer location owns the cap.
        client_max_body_size 5G;
        proxy_pass http://127.0.0.1:8000/api/v1/mobile/auth-check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_easypi_admin_auth {
        internal;
        # Backup imports can be large. The public endpoint keeps the real 4 GiB
        # limit; this bodyless auth subrequest must not reject them first.
        client_max_body_size 4G;
        proxy_pass http://127.0.0.1:8000/api/v1/auth/admin-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never expose go2rtc configuration/process-control endpoints.
    location ~ ^/go2rtc/api/(config|exit|restart|exec|echo)(/|$) {
        return 404;
    }

    # Browser media goes through /ws/cameras/<id>/live. Closing that backend
    # WebSocket also closes go2rtc's MSE consumer, so logout/account revocation
    # stops the server-side media flow. Never expose go2rtc directly.
    location /go2rtc/ {
        return 404;
    }

    # SPA fallback - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Favicon - return empty if not found (prevent 500 errors)
    location = /favicon.ico {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }
    
    # Robots.txt
    location = /robots.txt {
        try_files $uri =204;
        access_log off;
        log_not_found off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
