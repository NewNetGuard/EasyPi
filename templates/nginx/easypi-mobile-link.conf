# Private TLS endpoint reached only by chameleon-mobile-link-agent. The public
# VPS relay forwards opaque TLS records and never receives decrypted requests.
server {
    listen 127.0.0.1:9445 ssl;
    http2 on;
    server_name _;

    ssl_certificate /opt/EasyPi/certs/cert.pem;
    ssl_certificate_key /opt/EasyPi/certs/key.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:EASYPI_MOBILE_LINK_SSL:2m;
    ssl_session_timeout 10m;

    access_log off;
    server_tokens off;
    client_max_body_size 1M;
    client_body_timeout 60s;

    location = /api/v1/mobile/upload {
        auth_request /_easypi_mobile_auth;
        # The backend enforces 4 GiB per file; allow multipart headroom.
        client_max_body_size 5G;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location = /_easypi_mobile_auth {
        internal;
        client_max_body_size 5G;
        proxy_pass http://127.0.0.1:8000/api/v1/mobile/auth-check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/mobile/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location / {
        return 404;
    }
}
